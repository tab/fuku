version: 1

x-readiness-log: &readiness-log
  type: log
  pattern: "Service ready"
  timeout: 30s

x-readiness-http: &readiness-http
  type: http
  timeout: 30s
  interval: 500ms

x-readiness-tcp: &readiness-tcp
  type: tcp
  timeout: 30s
  interval: 500ms

x-logs: &logs
  output: [stdout, stderr]

# Display-only: the env tab in the TUI lists the values from these files; the service process does not receive them via fuku (the child runs in its own dir and is free to load .env files itself)
x-env: &env
  files:
    - .env
    - .env.local
    - .env.development
    - .env.development.local

services:
  auth:
    dir: examples/bookstore/auth
    env: *env
    tier: foundation
    readiness: *readiness-log
    logs: *logs

  storage:
    dir: examples/bookstore/storage
    tier: foundation
    readiness: *readiness-log
    logs: *logs

  user:
    dir: examples/bookstore/user
    tier: platform
    readiness:
      <<: *readiness-tcp
      address: localhost:9090
    logs: *logs

  api:
    dir: examples/bookstore/api
    tier: platform
    readiness:
      <<: *readiness-http
      url: http://localhost:8080/health
    logs: *logs

  worker:
    dir: examples/bookstore/worker
    tier: platform
    readiness:
      <<: *readiness-tcp
      address: localhost:9091
    logs: *logs

  frontend-api:
    dir: examples/bookstore/frontend-api
    tier: edge
    readiness:
      <<: *readiness-http
      url: http://localhost:8081/health
    logs: *logs

defaults:
  profiles: [default]

profiles:
  default: "*"
  core: [api, frontend-api, storage]
  minimal: [api, storage]

concurrency:
  workers: 10

retry:
  attempts: 5
  backoff: 1s

logs:
  buffer: 500

logging:
  format: console
  level: info
