name: Conventions
on:
  # Title edits included: a title that passed can be edited into one that would
  # not, and nothing else would re-check it
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
concurrency:
  # Its own workflow, so its own group. Sharing one with the code jobs lets a
  # title edit cancel a running suite, and a run that skips those jobs publishes
  # a skipped status over their real result, which branch protection counts as
  # a pass
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  conventions:
    # Dependabot writes its own titles and its own trailers, and neither is ours
    # to reword. Keyed on the author, not the actor: a human who reopens or
    # retitles one of its pull requests is the actor, and the title is still
    # Dependabot's. The .githooks copies catch this before the push, when installed
    name: Title & commits
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      # Both steps below grade against this, and it has to stay identical to
      # the pattern in .githooks/commit-msg
      SUBJECT: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9.-]+\): [A-Z]'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Title is a scoped Conventional Commit
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read the title over the API, not out of the event payload: a re-run
          # replays the payload it was triggered with, so a corrected title
          # would never clear a failure here
          title="$(gh pr view "$NUMBER" --json title --jq .title)"

          if ! grep -qE "$SUBJECT" <<<"$title"; then
            echo "::error::the title needs a scoped Conventional Commit, capitalized after the colon. Got: $title"
            exit 1
          fi
          if grep -qE '\.$' <<<"$title"; then
            echo "::error::drop the trailing period from the title. Got: $title"
            exit 1
          fi

      - name: Commit subjects are scoped Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # Merge commits carry a subject git wrote, and merging master into a
          # working branch is part of the workflow here
          subjects="$(git log --no-merges --format='%s' "origin/$BASE..HEAD")"

          # The rest of what .githooks/commit-msg skips: git writes a revert
          # subject, and a fixup or squash one goes away on the next rebase.
          # Keep this list in step with the case statement in that hook
          graded="$(grep -vE '^(Merge |Revert |fixup!|squash!)|^$' <<<"$subjects" || true)"

          if [ -z "$graded" ]; then
            echo "no commits of our own in the range"
            exit 0
          fi

          status=0

          malformed="$(grep -vE "$SUBJECT" <<<"$graded" || true)"
          if [ -n "$malformed" ]; then
            echo "::error::every commit subject needs a scoped Conventional Commit, capitalized after the colon"
            sed 's/^/  /' <<<"$malformed"
            status=1
          fi

          periods="$(grep -E '\.$' <<<"$graded" || true)"
          if [ -n "$periods" ]; then
            echo "::error::drop the trailing period from these commit subjects"
            sed 's/^/  /' <<<"$periods"
            status=1
          fi

          exit "$status"

      - name: Commit messages carry no AI attribution
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          attribution='^[[:space:]]*co-authored-by:.*(claude|anthropic|copilot|chatgpt|codex|cursor)|^[[:space:]]*claude-session:|generated (with|by) .*(claude|anthropic|copilot|chatgpt|codex|cursor)|https://claude\.(ai|com)/|🤖'
          hits="$(git log --format='%H %s%n%b' "origin/$BASE..HEAD" \
            | grep -inE "$attribution" || true)"
          if [ -n "$hits" ]; then
            echo "::error::remove the AI tooling attribution from the commit messages"
            sed 's/^/  /' <<<"$hits"
            exit 1
          fi
