name: Master
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "**.md"
      - "LICENSE"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:
concurrency:
  group: master
  cancel-in-progress: true
jobs:
  linter:
    name: Linter
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.11.3
  vet:
    name: Vet
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: go vet
        run: make vet
  static-check:
    name: Staticcheck
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: static-check
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431
        with:
          version: "v0.7.0"
          install-go: false
  tests:
    name: Tests
    permissions:
      contents: read
    env:
      GO_ENV: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ '1.26', '1.27' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.version }}
      - name: Run tests
        run: make test:race
  e2e:
    name: E2E
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build
        run: make build
      - name: Run e2e tests
        run: make test:e2e
  coverage:
    name: Codecov
    needs: [linter, vet, static-check, tests, e2e]
    permissions:
      contents: read
    env:
      GO_ENV: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Run coverage
        run: make test:race
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
