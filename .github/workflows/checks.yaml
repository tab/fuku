name: Checks
on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  linter:
    name: Linter
    if: github.event.action != 'edited'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: golangci-lint
        # NOTE: https://github.com/golangci/golangci-lint-action/releases/tag/v9.2.1
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee
        with:
          version: v2.11.3
  vet:
    name: Vet
    if: github.event.action != 'edited'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: go vet
        run: make vet
  static-check:
    name: Staticcheck
    if: github.event.action != 'edited'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: static-check
        # NOTE: https://github.com/dominikh/staticcheck-action/releases/tag/v1.4.1
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431
        with:
          install-go: false
  tests:
    name: Tests
    if: github.event.action != 'edited'
    permissions:
      contents: read
      pull-requests: write
    env:
      GO_ENV: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [ '1.25', '1.26' ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.version }}
      - name: Run tests
        run: make test:race
  e2e:
    name: E2E
    if: github.event.action != 'edited'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build
        run: make build
      - name: Run tests
        run: make test:e2e
  plugin:
    name: Plugin
    if: github.event.action != 'edited'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint
        working-directory: plugins/jetbrains
        run: ./gradlew ktlintCheck
      - name: Build
        working-directory: plugins/jetbrains
        run: ./gradlew buildPlugin
  coverage:
    name: Codecov
    needs: [linter, vet, static-check, tests, e2e]
    permissions:
      contents: read
      pull-requests: write
    env:
      GO_ENV: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Run coverage
        run: make test:race
      - name: Upload coverage to Codecov
        # NOTE: https://github.com/codecov/codecov-action/releases/tag/v6.0.1
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  conventions:
    # Dependabot writes its own titles and its own trailers, and neither is ours
    # to reword. The .githooks copies catch this before the push, when installed
    name: Title & commits
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Title is a scoped Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9.-]+\): [A-Z]' <<<"$TITLE"; then
            echo "::error::the title needs a scoped Conventional Commit, capitalized after the colon. Got: $TITLE"
            exit 1
          fi
          if grep -qE '\.$' <<<"$TITLE"; then
            echo "::error::drop the trailing period from the title. Got: $TITLE"
            exit 1
          fi

      - name: Commit messages carry no AI attribution
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          attribution='^[[:space:]]*co-authored-by:.*(claude|anthropic|copilot|chatgpt|codex|cursor)|^[[:space:]]*claude-session:|generated (with|by) .*(claude|anthropic|copilot|chatgpt|codex|cursor)|https://claude\.(ai|com)/|🤖'
          hits="$(git log --format='%H %s%n%b' "origin/$BASE..HEAD" \
            | grep -inE "$attribution" || true)"
          if [ -n "$hits" ]; then
            echo "::error::remove the AI tooling attribution from the commit messages"
            sed 's/^/  /' <<<"$hits"
            exit 1
          fi

  drift:
    # The spec is hand-maintained, so nothing but a diff catches it being left behind
    name: Spec drift
    if: github.event.action != 'edited'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: The spec ships with the change
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          ALLOW_SPEC_DRIFT: ${{ contains(github.event.pull_request.labels.*.name, 'contract-unchanged') && '1' || '' }}
        run: .github/scripts/openapi.sh "origin/$BASE"
